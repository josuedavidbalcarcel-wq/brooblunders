<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>BrooBlunders</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2290%22 font-size=%2290%22>♞</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#f3f1ec;--pn:#fff;--pn2:#ebe8e1;--tx:#262421;--mu:#76726a;--ac:#5f9b2f;--ln:#d8d4ca;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--pn:#262421;--pn2:#302e2b;--tx:#f0efe9;--mu:#9c9a94;--ac:#81b64c;--ln:#3a3834;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161512;--pn:#262421;--pn2:#302e2b;--tx:#f0efe9;--mu:#9c9a94;--ac:#81b64c;--ln:#3a3834;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--pn);border-right:1px solid var(--ln);padding:16px 10px;flex:none;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;padding:4px 10px 18px}.logo b{color:var(--ac)}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:var(--mu);cursor:pointer;font-weight:600}nav a:hover{background:var(--pn2)}nav a.on{background:var(--pn2);color:var(--tx)}
#main{flex:1;padding:24px;max-width:1100px;margin:0 auto;min-width:0}
h1{margin:0 0 16px;font-size:24px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px inherit;cursor:pointer}button.s{background:var(--pn2);color:var(--tx)}button:disabled{opacity:.5}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px;font:inherit}textarea{min-height:160px;font:12px monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--ln);gap:8px}.mu{color:var(--mu)}
.wrap{display:grid;grid-template-columns:minmax(280px,560px) 1fr;gap:16px;align-items:start}.bw{display:flex;gap:8px}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;flex:1;border-radius:6px;overflow:hidden;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:min(7vw,52px);line-height:1}.sq.l{background:#ebecd0}.sq.d{background:#779556}.sq.hl{box-shadow:inset 0 0 0 100px rgba(255,235,60,.45)}
.sq.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.sq.b{color:#111;text-shadow:0 0 1px #fff}.sq.t::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(0,0,0,.2)}
.board svg{position:absolute;inset:0;pointer-events:none}
#eb{width:22px;background:#333;border-radius:4px;position:relative;overflow:hidden;flex:none}#eb i{position:absolute;left:0;right:0;background:#fff;transition:.3s}#eb span{position:absolute;left:0;right:0;font-size:9px;text-align:center;color:#888;font-weight:700}
.mv{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px;max-height:230px;overflow:auto;font-size:14px}.mv span{padding:2px 6px;border-radius:4px;cursor:pointer}.mv span.on{background:var(--ac);color:#fff}
.cl{display:inline-block;font-weight:800}.chat{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}.m{padding:9px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}.m.u{background:var(--ac);color:#fff;align-self:flex-end}.m.a{background:var(--pn2)}
.chip{background:var(--pn2);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:13px}
.card{background:linear-gradient(180deg,var(--pn),var(--pn2));box-shadow:0 2px 0 rgba(0,0,0,.18),0 12px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);border-color:transparent}
button,.btn{box-shadow:0 4px 0 rgba(0,0,0,.3),0 6px 12px rgba(0,0,0,.2);transition:.08s}button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}button.s{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln)}
button:not(.s):not(.chip){background:linear-gradient(180deg,#96c35c,var(--ac))}
nav{box-shadow:6px 0 24px rgba(0,0,0,.25)}nav a.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.3)}
.board{box-shadow:0 0 0 5px var(--pn2),0 16px 36px rgba(0,0,0,.5)}#eb{box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.08)}.chip{box-shadow:0 3px 0 rgba(0,0,0,.3)}.gi{border-top:0;margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--bg);box-shadow:inset 0 2px 5px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.05)}
input,textarea{box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}.stat{transition:.15s}.stat:hover{transform:translateY(-3px)}
.bdg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:11px;font-weight:800;vertical-align:middle;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.4)}
.sr{display:grid;grid-template-columns:1fr 2fr 1fr;text-align:center;padding:3px 0;font-weight:600}.dz{border:2px dashed var(--ln);border-radius:12px;padding:18px;text-align:center;color:var(--mu);box-shadow:inset 0 2px 8px rgba(0,0,0,.2)}.dz.on{border-color:var(--ac)}
.sq.l{background:#e1e3ec}.sq.d{background:#3b475d}.sq.hl{box-shadow:inset 0 0 0 100px rgba(255,208,0,.38)}.board{border-radius:4px}
.pc{font-style:normal;font-size:min(7.4vw,60px);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}.pc.w{color:#f6f6f6;-webkit-text-stroke:1.6px #232323;paint-order:stroke fill}.pc.b{color:#5d5955;-webkit-text-stroke:1.6px #1c1b1a;paint-order:stroke fill}
.co{position:absolute;font-size:clamp(9px,1.7vw,14px);font-weight:700;pointer-events:none;line-height:1}.co.r{top:3px;left:4px}.co.f{bottom:3px;right:4px}.sq.l .co{color:#3b475d}.sq.d .co{color:#e1e3ec}
.bp{position:absolute;top:1%;right:1%;width:36%;height:36%;font-size:clamp(8px,1.6vw,13px);z-index:3;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.board{width:100%;min-width:0;grid-template-rows:repeat(8,1fr);grid-auto-rows:1fr;container-type:inline-size}.sq{min-width:0;min-height:0;overflow:hidden}.pc{font-size:10.4cqw}
.bdg{background-image:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28))!important;border:1.5px solid rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 3px 0 rgba(0,0,0,.4),0 6px 10px rgba(0,0,0,.4),inset 0 2px 2px rgba(255,255,255,.55),inset 0 -3px 4px rgba(0,0,0,.3)}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow:auto;padding:6px}.logo{display:none}#main{padding:12px}.wrap{grid-template-columns:1fr}}
</style></head><body><div id="app"><nav id="nav"></nav><div id="main"></div></div>
<script>
const $=s=>document.querySelector(s),Q=window.Chess;
let S={games:[],me:'',coach:[],mist:[]},A=null,R='dash';
try{Object.assign(S,JSON.parse(localStorage.getItem('bb1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb1',JSON.stringify(S))}catch(e){}};
const G={'♟':'p'},U={w:{p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'},b:{p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};
/* ---------- sonidos (sintetizados con WebAudio) ---------- */
let AC;function snd(t){try{AC=AC||new AudioContext();const n=AC.currentTime;
const tone=(f,d,v,ty='sine',s=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n+s);o.frequency.exponentialRampToValueAtTime(f*.6,n+s+d);g.gain.setValueAtTime(v,n+s);g.gain.exponentialRampToValueAtTime(.001,n+s+d);o.connect(g).connect(AC.destination);o.start(n+s);o.stop(n+s+d)};
const noi=(d,v,f,s=0)=>{const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const o=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type='bandpass';fl.frequency.value=f;g.gain.value=v;o.buffer=b;o.connect(fl).connect(g).connect(AC.destination);o.start(n+s)};
({move:()=>{noi(.05,.9,900);tone(200,.08,.3)},cap:()=>{noi(.09,1.4,1400);tone(150,.12,.5)},check:()=>{noi(.05,.9,900);tone(700,.18,.15,'triangle',.04)},castle:()=>{noi(.05,.9,900);noi(.05,.9,1100,.1);tone(200,.08,.3)},end:()=>[523,659,784].forEach((f,i)=>tone(f,.4,.2,'triangle',i*.12)),ok:()=>{tone(880,.15,.2,'triangle');tone(1320,.2,.2,'triangle',.1)},bad:()=>tone(160,.3,.35,'sawtooth')})[t]()}catch(e){}}
const sfx=m=>snd(/[#+]/.test(m.san)?(m.san.includes('#')?'end':'check'):m.captured?'cap':/O-O/.test(m.san)?'castle':'move');
/* ---------- tablero ---------- */
function Board(el,o){let sel=null,flip=!!o.flip;const self={
set flip(v){flip=v},get flip(){return flip},arrow:null,
draw(){const g=o.game(),lm=o.last&&o.last(),tg=sel?g.moves({square:sel,verbose:true}).map(m=>m.to):[];let h='';
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const f=flip?7-c:c,k=flip?r:7-r,sq='abcdefgh'[f]+(k+1),p=g.get(sq);
h+=`<div class="sq ${(f+k)%2?'l':'d'} ${p?p.color:''} ${lm&&(lm.from==sq||lm.to==sq)||sel==sq?'hl':''} ${tg.includes(sq)?'t':''}" data-s="${sq}">${p?U[p.color][p.type]:''}</div>`}
const ct=s=>[(flip?7-'abcdefgh'.indexOf(s[0]):'abcdefgh'.indexOf(s[0]))+.5,(flip?s[1]-1:8-s[1])+.5];
if(self.arrow){const[a,b]=[ct(self.arrow.slice(0,2)),ct(self.arrow.slice(2,4))];h+=`<svg viewBox="0 0 8 8"><defs><marker id="ar" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5" orient="auto"><path d="M0,0L3,1.5L0,3z" fill="#5f9b2f"/></marker></defs><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#5f9b2f" stroke-width=".2" opacity=".85" marker-end="url(#ar)"/></svg>`}
el.innerHTML=h},
click(sq){const g=o.game();if(sel&&g.moves({square:sel,verbose:true}).some(m=>m.to==sq)){const f=sel;sel=null;o.onMove&&o.onMove({from:f,to:sq,promotion:'q'});return}
const p=g.get(sq);sel=p&&p.color==g.turn()?sq:null;self.draw()}};
el.onclick=e=>{const s=e.target.closest('.sq');s&&self.click(s.dataset.s)};return self}
/* ---------- motor: Stockfish (WASM/asm.js) con respaldo interno ---------- */
const PV={p:100,n:320,b:330,r:500,q:900,k:0};
const nm=(g,d,a,b)=>{if(!d){let s=0;for(const r of g.board())for(const p of r)if(p)s+=(p.color=='w'?1:-1)*PV[p.type];return g.turn()=='w'?s:-s}
const ms=g.moves({verbose:true});if(!ms.length)return g.in_check()?-9999-d:0;ms.sort((x,y)=>!!y.captured-!!x.captured);let B=-1e9;for(const m of ms){g.move(m);const v=-nm(g,d-1,-b,-a);g.undo();if(v>B)B=v;if(v>a)a=v;if(a>=b)break}return B};
const eng={w:null,ok:false,name:'Motor interno (básico)',
async init(){try{const b=new Blob(["importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')"],{type:'text/javascript'});this.w=new Worker(URL.createObjectURL(b));
await new Promise((ok,no)=>{const t=setTimeout(no,8000);this.w.onerror=no;this.w.onmessage=e=>{if(/uciok/.test(e.data)){clearTimeout(t);ok()}};this.w.postMessage('uci')});this.ok=true;this.name='Stockfish'}catch(e){this.ok=false}
const t=$('#eng');if(t)t.textContent='Motor: '+this.name},
async ev(fen,d=12){const g=new Q(fen),wt=g.turn()=='w';
if(g.game_over())return{cp:g.in_checkmate()?(wt?-3000:3000):0,best:null};
if(!this.ok){await new Promise(r=>setTimeout(r));const m=g.moves({verbose:true});let bv=-1e9,bm;for(const x of m){g.move(x);const v=-nm(g,2,-1e9,1e9);g.undo();if(v>bv){bv=v;bm=x}}return{cp:wt?bv:-bv,best:bm.from+bm.to+(bm.promotion||'')}}
return new Promise(res=>{let cp=0;this.w.onmessage=e=>{const s=String(e.data),m=s.match(/score (cp|mate) (-?\d+)/);if(m&&!/bound/.test(s))cp=m[1]=='cp'?+m[2]:(m[2]>0?1:-1)*(3000-Math.abs(m[2])*10);
if(s.startsWith('bestmove'))res({cp:wt?cp:-cp,best:s.split(' ')[1]})};this.w.postMessage('position fen '+fen);this.w.postMessage('go depth '+d)})}};
const win=cp=>50+50*(2/(1+Math.exp(-.00368*Math.max(-1500,Math.min(1500,cp))))-1);
const acc=l=>Math.max(0,Math.min(100,103.17*Math.exp(-.04354*l)-3.17));
const CL=[[0,'Brilliant','#1baca6','!!'],[0,'Awesome','#5b8baf','!'],[0,'Best','#81b64c','★'],[0,'Nice','#6f9e3c','▲'],[0,'Ok','#8fae6e','✓'],[0,'Theoretical','#a88865','≡'],[0,'Strange','#f2b632','?!'],[0,'Bad','#e58f2a','?'],[0,'Miss','#e8554f','✕'],[0,'Clown','#b3332f','??']];
/* ---------- utilidades ---------- */
function parse(txt){let n=0;txt.split(/(?=\[Event ")/).forEach((p,i)=>{if(!p.trim())return;const c=new Q();if(!c.load_pgn(p)||!c.history().length||S.games.some(g=>g.pgn==p))return;const h=c.header();S.games.unshift({id:Date.now()+i,pgn:p,white:h.White,black:h.Black,res:h.Result,date:h.Date,we:h.WhiteElo,be:h.BlackElo});n++});save();return n}
const mine=g=>S.me&&g.black&&g.black.toLowerCase()==S.me.toLowerCase()?'b':'w';
function profile(){const rv=S.games.filter(g=>g.rev);if(!rv.length)return'El alumno aún no ha revisado partidas.';let ph={open:0,mid:0,end:0},er=0,ac=[];
rv.forEach(g=>{const c=mine(g);ac.push(g.rev.acc[c]);g.rev.cls.forEach((k,i)=>{if(i%2==(c=='w'?0:1)&&k>=7){er++;ph[i<20?'open':i<60?'mid':'end']++}})});
return`Partidas revisadas: ${rv.length}. Precisión media: ${(ac.reduce((a,b)=>a+b)/ac.length).toFixed(1)}%. Errores y errores graves: ${er} (apertura ${ph.open}, medio juego ${ph.mid}, final ${ph.end}). Puzles fallados guardados: ${S.mist.length}.`}
/* ---------- vistas ---------- */
const NAV=[['dash','🏠','Panel'],['imp','⬇️','Importar'],['ana','🔍','Análisis'],['puz','🧩','Puzles'],['coach','🎓','Profesor']];
function go(r){R=r;$('#nav').innerHTML='<div class="logo">♞ Broo<b>Blunders</b></div>'+NAV.map(n=>`<a class="${n[0]==R?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('');V[r]()}
const V={
dash(){const rv=S.games.filter(g=>g.rev),a=rv.length?(rv.reduce((s,g)=>s+g.rev.acc[mine(g)],0)/rv.length).toFixed(1)+'%':'—';
let w=0,d=0,l=0;S.games.forEach(g=>{const c=mine(g),r=g.res;r=='1/2-1/2'?d++:(r=='1-0'&&c=='w')||(r=='0-1'&&c=='b')?w++:l++});
$('#main').innerHTML=`<h1>Panel</h1><div class="grid"><div class="card stat"><b>${S.games.length}</b><span>Partidas importadas</span></div><div class="card stat"><b>${a}</b><span>Precisión media</span></div><div class="card stat"><b>${w}/${d}/${l}</b><span>Victorias / tablas / derrotas</span></div><div class="card stat"><b>${S.mist.length}</b><span>Puzles de tus errores</span></div></div>
<div class="card"><h3 style="margin-top:0">Tus partidas</h3>${S.games.length?S.games.slice(0,40).map(g=>`<div class="gi"><div>${g.white} <span class="mu">(${g.we||'?'})</span> vs ${g.black} <span class="mu">(${g.be||'?'})</span><div class="mu" style="font-size:12px">${g.date} · ${g.res}${g.rev?` · precisión ${g.rev.acc.w.toFixed(0)}% / ${g.rev.acc.b.toFixed(0)}%`:''}</div></div><button onclick="open_(${g.id})">${g.rev?'Ver revisión':'Revisar'}</button></div>`).join(''):'<p class="mu">Aún no hay partidas. Ve a <a onclick="go(\'imp\')" style="color:var(--ac);cursor:pointer">Importar</a>.</p>'}</div>`},
imp(){const d=new Date(),ym=k=>{const x=new Date(d.getFullYear(),d.getMonth()-k,1);return x.getFullYear()+'/'+String(x.getMonth()+1).padStart(2,'0')};
$('#main').innerHTML=`<h1>Importar partidas de Chess.com</h1><div class="card"><p>Tu usuario de Chess.com (para saber qué color juegas):</p><input id="u" value="${S.me}" placeholder="usuario"><p class="mu">Esta página no puede llamar directamente a la API de Chess.com (el alojamiento bloquea conexiones externas), pero es un paso rápido:</p>
<div class="row" id="lk"></div><p class="mu">1) Pulsa un mes: se abre/descarga el PGN de tus partidas. 2) Copia el texto o sube el archivo aquí abajo.</p><textarea id="t" placeholder="Pega aquí el PGN..."></textarea><div class="row" style="margin-top:8px"><input type="file" id="f" accept=".pgn,.txt" style="width:auto"><button onclick="doImp()">Importar</button><span id="r" class="mu"></span></div></div>`;
const u=()=>$('#u').value.trim();$('#lk').innerHTML=[0,1,2].map(k=>`<a class="btn s" style="text-decoration:none;color:var(--tx)" target="_blank" rel="noopener" onclick="this.href='https://api.chess.com/pub/player/'+($('#u').value.trim()||'x').toLowerCase()+'/games/${ym(k)}/pgn'">PGN ${ym(k)}</a>`).join('');
$('#f').onchange=e=>e.target.files[0].text().then(t=>$('#t').value=t)},
ana(){if(!A)return $('#main').innerHTML='<h1>Análisis</h1><div class="card">Elige una partida en el Panel.</div>';
const g=S.cur;$('#main').innerHTML=`<h1>${g.white} vs ${g.black}</h1><div class="wrap"><div><div class="bw"><div id="eb"><i></i><span></span></div><div class="board" id="bd"></div></div><div class="row" style="justify-content:center;margin-top:8px"><button class="s" onclick="nav(-99)">⏮</button><button class="s" onclick="nav(-1)">◀</button><button class="s" onclick="nav(1)">▶</button><button class="s" onclick="nav(99)">⏭</button><button class="s" onclick="B.flip=!B.flip;upd()">⇅</button></div></div>
<div><div class="card" style="margin-bottom:12px"><div id="inf"></div><div class="row" style="margin-top:8px"><button id="rb" onclick="review()">${g.rev?'Revisar de nuevo':'Revisión de partida'}</button><span id="eng" class="mu"></span></div></div><div class="card" style="margin-bottom:12px"><svg id="gr" viewBox="0 0 400 80" style="width:100%;cursor:pointer"></svg></div><div class="card" id="sm" style="margin-bottom:12px"></div><div class="card"><div class="mv" id="ml"></div></div></div></div>`;
B=Board($('#bd'),{game:()=>new Q(A.fens[A.i]),last:()=>A.mv[A.i-1],flip:A.flip,badge:()=>{const r=S.cur.rev;return r&&A.i?{sq:A.mv[A.i-1].to,k:r.cls[A.i-1]}:null}});$('#eng').textContent='Motor: '+eng.name;upd(0)},

function snd(t){try{AC=AC||new AudioContext();const n=AC.currentTime;
const clack=(v,f,s=0)=>{const b=AC.createBuffer(1,AC.sampleRate*.06,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.exp(-i/(x.length*.08));
const o=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=2.2;g.gain.value=v;o.buffer=b;o.connect(fl).connect(g).connect(AC.destination);o.start(n+s);
const q=AC.createOscillator(),h=AC.createGain();q.frequency.setValueAtTime(f/7,n+s);q.frequency.exponentialRampToValueAtTime(55,n+s+.07);h.gain.setValueAtTime(v*.45,n+s);h.gain.exponentialRampToValueAtTime(.001,n+s+.09);q.connect(h).connect(AC.destination);q.start(n+s);q.stop(n+s+.1)};
const tone=(f,d,v,s=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,n+s);g.gain.exponentialRampToValueAtTime(.001,n+s+d);o.connect(g).connect(AC.destination);o.start(n+s);o.stop(n+s+d)};
({move:()=>clack(1,1500),cap:()=>{clack(1.8,1900);clack(1.1,1100,.05)},check:()=>{clack(1,1500);tone(740,.2,.12,.05)},castle:()=>{clack(1,1400);clack(.9,1700,.12)},end:()=>{clack(1.6,1800);[523,659,784].forEach((f,i)=>tone(f,.45,.18,.12+i*.12))},ok:()=>{tone(880,.15,.2);tone(1320,.2,.2,.1)},bad:()=>{clack(.7,500);tone(160,.25,.2)}})[t]()}catch(e){}}
const oldEv=eng.ev;eng.ws=[];eng.free=[];eng.q=[];eng.cache=new Map();
eng.init=async function(){const U=['https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js','https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'];
const mk=async u=>{const w=new Worker(URL.createObjectURL(new Blob(["importScripts('"+u+"')"],{type:'text/javascript'})));await new Promise((ok,no)=>{const t=setTimeout(no,9000);w.onerror=no;w.onmessage=e=>{if(/uciok/.test(e.data)){clearTimeout(t);ok()}};w.postMessage('uci')});return w};
let url=null;for(const u of U){try{this.ws=[await mk(u)];url=u;break}catch(e){}}
if(url){const N=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1));const rest=await Promise.all(Array.from({length:N-1},()=>mk(url).catch(()=>null)));this.ws.push(...rest.filter(Boolean));this.free=[...this.ws];this.ok=true;this.name='Stockfish ×'+this.ws.length+' núcleos'}else this.name='Stockfish no cargó (motor básico)';const t=$('#eng');if(t)t.textContent='Motor: '+this.name};
function pump(){while(eng.free.length&&eng.q.length){const w=eng.free.pop(),j=eng.q.shift();let cp=0;w.onmessage=e=>{const s=String(e.data),m=s.match(/score (cp|mate) (-?\d+)/);if(m&&!/bound/.test(s))cp=m[1]=='cp'?+m[2]:(m[2]>0?1:-1)*(3000-Math.abs(m[2])*10);
if(s.startsWith('bestmove')){const r={cp:j.wt?cp:-cp,best:s.split(' ')[1]};eng.cache.set(j.key,r);eng.free.push(w);j.res(r);pump()}};w.postMessage('position fen '+j.fen);w.postMessage('go depth '+j.d)}}
eng.ev=function(fen,d=10){const g=new Q(fen),wt=g.turn()=='w';if(g.game_over())return Promise.resolve({cp:g.in_checkmate()?(wt?-3000:3000):0,best:null});
if(!this.ok||!this.free.length&&!this.ws.length)return oldEv.call(this,fen,d);const key=fen+d;if(this.cache.has(key))return Promise.resolve(this.cache.get(key));return new Promise(res=>{this.q.push({fen,d,wt,key,res});pump()})};
